[project]
name = "enterprise-rag-assistant"
version = "1.0.0"
description = "Enterprise RAG Knowledge Assistant: cited answers over company policy documents."
requires-python = ">=3.11"
authors = [{ name = "Magnum Minds AI" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM905"]
