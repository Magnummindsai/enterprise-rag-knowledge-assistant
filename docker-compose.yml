services:
  app:
    build:
      context: .
      args:
        PRELOAD_RERANKER: ${PRELOAD_RERANKER:-false}
    image: enterprise-rag-assistant:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # no .env -> MOCK mode
    volumes:
      - rag-storage:/app/storage          # vector index cache + SQLite
      - hf-cache:/app/.cache/huggingface  # BGE reranker weights
    depends_on:
      postgres:
        condition: service_healthy
        required: false        # only when started with --profile postgres
    restart: unless-stopped

  # Optional: docker compose --profile postgres up
  # and set DATABASE_URL=postgresql+psycopg://rag:rag@postgres:5432/rag in .env
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rag-storage:
  hf-cache:
  pg-data:
